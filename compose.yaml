name: knowforge-metrics
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_DATABASE: knowforge_metrics
      MYSQL_USER: metrics_app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请先运行 scripts/configure.py}
    ports:
      - "127.0.0.1:13308:3306"
    volumes:
      - metrics_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
    volumes:
      - metrics_etcd:/etcd
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: ${MYSQL_PASSWORD:?请先生成配置}
    command: minio server /minio_data
    volumes:
      - metrics_minio:/minio_data
  milvus:
    image: milvusdb/milvus:v2.5.15
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: minioadmin
      MINIO_SECRET_ACCESS_KEY: ${MYSQL_PASSWORD:?请先生成配置}
    ports:
      - "127.0.0.1:19531:19530"
    volumes:
      - metrics_milvus:/var/lib/milvus
    depends_on:
      - etcd
      - minio
volumes:
  metrics_mysql:
  metrics_etcd:
  metrics_minio:
  metrics_milvus:
